<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-Premium Metallic Gold Gradients -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="35%" stop-color="#F5D061" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B38714" />
      <stop offset="50%" stop-color="#F9E27A" />
      <stop offset="100%" stop-color="#FFEAA5" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6C045" />
      <stop offset="50%" stop-color="#C49B22" />
      <stop offset="100%" stop-color="#785B07" />
    </linearGradient>

    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge Circle -->
  <circle cx="100" cy="100" r="94" fill="#060B18" />

  <!-- Distinct White / Silver Outer Border Ring -->
  <circle
    cx="100"
    cy="100"
    r="88"
    stroke="url(#silverRing)"
    stroke-width="5"
    fill="none"
  />

  <!-- Subdued Inner Accent Ring -->
  <circle
    cx="100"
    cy="100"
    r="83"
    stroke="url(#goldBright)"
    stroke-width="1"
    stroke-opacity="0.4"
    fill="none"
  />

  <!-- Flight Path Arc (Left to Right Ascending Curve) -->
  <path
    d="M 28 118 C 30 75, 75 42, 160 48"
    stroke="url(#goldBright)"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 36 126 C 38 88, 80 52, 150 56"
    stroke="url(#goldShine)"
    stroke-width="1.5"
    stroke-dasharray="4 3"
    stroke-opacity="0.8"
    fill="none"
  />

  <!-- Jet Airplane (Top Right Taking Off) -->
  <g transform="translate(162, 46) rotate(-22) scale(0.95)">
    <!-- Airplane Body & Wings -->
    <path
      d="M 18 0 L -10 -8 L -4 -2 L -16 -4 L -14 0 L -16 4 L -4 2 L -10 8 Z"
      fill="url(#silverRing)"
    />
    <path
      d="M 18 0 L -6 -6 L -2 0 L -6 6 Z"
      fill="url(#goldBright)"
    />
  </g>

  <!-- High Rise Skyscrapers / Buildings Group -->
  <g id="skyscrapers">
    <!-- Building 1 (Far Left Small) -->
    <path d="M 44 146 L 44 104 L 56 96 L 56 146 Z" fill="url(#goldDark)" />
    <path d="M 50 146 L 50 100 L 56 96 L 56 146 Z" fill="url(#goldShine)" opacity="0.5" />

    <!-- Building 2 (Mid Left Medium) -->
    <path d="M 58 146 L 58 84 L 74 72 L 74 146 Z" fill="url(#goldBright)" />
    <path d="M 66 146 L 66 78 L 74 72 L 74 146 Z" fill="url(#goldShine)" opacity="0.6" />
    <!-- Spire on Building 2 -->
    <path d="M 65 73 L 67 52 L 69 73 Z" fill="url(#goldShine)" />

    <!-- Building 3 (Center Main Tallest Tower) -->
    <path d="M 76 146 L 76 60 L 98 44 L 98 146 Z" fill="url(#goldShine)" />
    <path d="M 87 146 L 87 52 L 98 44 L 98 146 Z" fill="url(#goldBright)" opacity="0.75" />
    <!-- Center Tower Spire -->
    <path d="M 86 44 L 88 22 L 90 44 Z" fill="url(#silverRing)" />

    <!-- Building 4 (Mid Right Tall Tower) -->
    <path d="M 100 146 L 100 68 L 120 54 L 120 146 Z" fill="url(#goldDark)" />
    <path d="M 110 146 L 110 61 L 120 54 L 120 146 Z" fill="url(#goldBright)" opacity="0.6" />
    <!-- Spire on Building 4 -->
    <path d="M 109 55 L 111 36 L 113 55 Z" fill="url(#goldShine)" />

    <!-- Building 5 (Far Right Mid) -->
    <path d="M 122 146 L 122 90 L 138 78 L 138 146 Z" fill="url(#goldBright)" />
    <path d="M 130 146 L 130 84 L 138 78 L 138 146 Z" fill="url(#goldShine)" opacity="0.7" />

    <!-- Building 6 (Far Right Small) -->
    <path d="M 140 146 L 140 108 L 152 100 L 152 146 Z" fill="url(#goldDark)" />

    <!-- 3D Facet Highlight Lines across Building Fronts -->
    <line x1="50" y1="100" x2="50" y2="146" stroke="#FFF5B8" stroke-width="0.8" opacity="0.4" />
    <line x1="66" y1="78" x2="66" y2="146" stroke="#FFF5B8" stroke-width="1" opacity="0.5" />
    <line x1="87" y1="52" x2="87" y2="146" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7" />
    <line x1="110" y1="61" x2="110" y2="146" stroke="#FFF5B8" stroke-width="1" opacity="0.5" />
    <line x1="130" y1="84" x2="130" y2="146" stroke="#FFF5B8" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Base Horizon Curved Arc / Swoosh -->
  <path
    d="M 32 140 C 65 162, 135 162, 168 140 C 145 152, 55 152, 32 140 Z"
    fill="url(#goldBright)"
  />
  <path
    d="M 38 145 C 70 166, 130 166, 162 145 C 140 155, 60 155, 38 145 Z"
    fill="url(#goldShine)"
  />
</svg>
